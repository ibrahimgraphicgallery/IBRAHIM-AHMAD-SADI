<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফ্রেমে আপনার ছবি বসান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--tx:#1b2a41;--pri:#8a5a14}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--tx:#eee}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;text-align:center;padding:16px}
h1{font-size:20px;margin:6px 0 2px}.sub{font-size:13px;opacity:.75;margin-bottom:12px}#wrap{max-width:560px;margin:auto}
canvas{width:100%;height:auto;display:block;touch-action:none;box-shadow:0 2px 14px #0003;background:#fff}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:9px 18px;background:var(--pri);color:#fff;cursor:pointer;margin:6px 3px}
button.sec{background:#6c7c88}button:disabled{background:#9aa8b0}#dl{width:100%;margin-top:14px;padding:12px}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:14px}input[type=range]{width:180px}#hint{font-size:12px;opacity:.7;margin-top:8px}
</style></head><body><div id="wrap">
<h1 id="title">লোড হচ্ছে...</h1><div class="sub" id="sub"></div><canvas id="c" width="10" height="10"></canvas>
<div id="hint">ছবি আপলোড করে আঙুল/মাউস দিয়ে টেনে সরান</div>
<input type="file" id="pf" accept="image/*" hidden><button id="up">ছবি আপলোড করুন</button>
<div class="row"><span>ছবি বড় করুন</span><input type="range" id="z" min="1" max="3" step="0.01" value="1"><button class="sec" id="rs">আবার ঠিক করুন</button></div>
<button id="dl" disabled>ছবি ডাউনলোড করুন</button></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let C,frame,box,photo,zoom=1,ox=0,oy=0,drag=null;
const slug=new URLSearchParams(location.search).get('c');
(async()=>{try{
 const r=await fetch(`${SB_URL}/rest/v1/campaigns?slug=eq.${encodeURIComponent(slug)}&select=*`,{headers:{apikey:SB_KEY}});
 C=(await r.json())[0]; if(!C)throw 0;
 $('title').textContent=C.title;$('sub').textContent=C.subtitle||'';document.title=C.title;box=C.box;
 const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{frame=im;cv.width=im.naturalWidth;cv.height=im.naturalHeight;draw()};
 im.src=`${SB_URL}/storage/v1/object/public/frames/${C.frame_path}`;
}catch(e){$('title').textContent='লিংকটি ঠিক নেই';$('up').style.display='none'}})();
function bx(){return{x:box.x*cv.width,y:box.y*cv.height,w:box.w*cv.width,h:box.h*cv.height}}
function draw(){if(!frame)return;ctx.clearRect(0,0,cv.width,cv.height);const b=bx();
 ctx.fillStyle='#e4e4e4';ctx.fillRect(b.x,b.y,b.w,b.h);
 if(photo){ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();
  const s=Math.max(b.w/photo.naturalWidth,b.h/photo.naturalHeight)*zoom,w=photo.naturalWidth*s,h=photo.naturalHeight*s;
  ctx.drawImage(photo,b.x+(b.w-w)/2+ox*b.w,b.y+(b.h-h)/2+oy*b.h,w,h);ctx.restore()}
 ctx.drawImage(frame,0,0)}
$('up').onclick=()=>$('pf').click();
$('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{photo=im;zoom=1;ox=oy=0;$('z').value=1;$('dl').disabled=false;draw()};im.src=URL.createObjectURL(f)};
$('z').oninput=e=>{zoom=+e.target.value;draw()};
$('rs').onclick=()=>{zoom=1;ox=oy=0;$('z').value=1;draw()};
$('dl').onclick=()=>{const a=document.createElement('a');a.download=C.file_name||'photo-frame.png';a.href=cv.toDataURL('image/png');a.click()};
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}};
cv.onpointerdown=e=>{if(photo){cv.setPointerCapture(e.pointerId);drag={p:pt(e),ox,oy}}};
cv.onpointermove=e=>{if(drag){const p=pt(e);ox=drag.ox+(p.x-drag.p.x)/box.w;oy=drag.oy+(p.y-drag.p.y)/box.h;draw()}};
cv.onpointerup=()=>drag=null;
</script></body></html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফ্রেমে আপনার ছবি বসান</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--tx:#1b2a41;--pri:#8a5a14;--mut:#9aa8b0}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--tx:#eee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;text-align:center;padding:16px}
h1{font-size:20px;margin:6px 0 2px}.sub{font-size:12px;opacity:.7;margin-bottom:12px}
#wrap{max-width:560px;margin:auto}
canvas{width:100%;height:auto;display:block;touch-action:none;box-shadow:0 2px 14px #0003;background:#fff}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:9px 18px;background:var(--pri);color:#fff;cursor:pointer;margin:6px 3px;display:inline-block}
button.sec{background:#6c7c88}button:disabled{background:var(--mut);cursor:not-allowed}
#dl{width:100%;margin-top:14px;padding:12px}
.row{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0;font-size:14px}
input[type=range]{width:180px}
#setup{display:none;text-align:left;font-size:14px;margin-top:12px}
#setup textarea{width:100%;height:70px;font-family:monospace}
a.link{font-size:13px;color:inherit;cursor:pointer;text-decoration:underline}
#hint{font-size:12px;opacity:.7}
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title"></h1><div class="sub" id="sub"></div>
  <canvas id="c"></canvas>
  <div id="hint">ছবি আপলোড করে আঙুল/মাউস দিয়ে টেনে সরান</div>
  <input type="file" id="pf" accept="image/*" hidden>
  <button id="up">ছবি আপলোড করুন</button>
  <div class="row"><span>ছবি বড় করুন</span><input type="range" id="z" min="1" max="3" step="0.01" value="1"><button class="sec" id="rs">আবার ঠিক করুন</button></div>
  <button id="dl" disabled>ছবি ডাউনলোড করুন</button>
  <p><a class="link" id="stog">⚙ সেটআপ (শুধু অ্যাডমিন)</a></p>

  <div id="setup">
    <b>সেটআপ:</b>
    <ol>
      <li>আপনার প্লাকার্ড/পোস্টার (PNG) সিলেক্ট করুন:
        <input type="file" id="ff" accept="image/*"></li>
      <li>পোস্টারের ওপর মাউস দিয়ে টেনে ছবি বসার জায়গাটা আঁকুন।</li>
      <li>নিচের কোড কপি করে <code>CONFIG.box</code>-এ বসান, আর পোস্টারটা <code>frame.png</code> নামে index.html-এর পাশে রাখুন।</li>
    </ol>
    <textarea id="out" readonly></textarea>
  </div>
</div>

<script>
// ====== এখানে আপনার সেটিংস ======
const CONFIG = {
  title: "ফ্রেমে আপনার ছবি বসান",
  subtitle: "তৃতীয় বার্ষিক আন্তর্জাতিক সিরাত কনফারেন্স ২০২৬",
  frame: "frame.png",          // আপনার প্লাকার্ডের ফাইল
  box: {"x":0.6624,"y":0.1555,"w":0.2731,"h":0.4412},  // ছবি বসার জায়গা
  radius: 42,                  // কোণা কতটা গোল (পোস্টার পিক্সেলে)
  fileName: "sirat-conference-2026.png"
};
// =================================

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let frame = null, box = CONFIG.box, transparent = true, photo = null, zoom = 1, ox = 0, oy = 0, setup = false;
$('title').textContent = CONFIG.title; $('sub').textContent = CONFIG.subtitle;
try { if (!box) box = JSON.parse(localStorage.getItem('box')); } catch (e) {}

function loadFrame(src) {
  const im = new Image();
  im.onload = () => { frame = im; cv.width = im.naturalWidth; cv.height = im.naturalHeight; detect(); draw(); };
  im.onerror = () => { $('hint').textContent = 'frame.png পাওয়া যায়নি — নিচের সেটআপ থেকে পোস্টার সিলেক্ট করুন'; setSetup(true); };
  im.src = src;
}
function px() { return { x: box.x * cv.width, y: box.y * cv.height, w: box.w * cv.width, h: box.h * cv.height }; }
function detect() {
  if (!frame || !box) return;
  const t = document.createElement('canvas'); t.width = frame.naturalWidth; t.height = frame.naturalHeight;
  const g = t.getContext('2d'); g.drawImage(frame, 0, 0);
  const b = px(); transparent = g.getImageData(Math.floor(b.x + b.w / 2), Math.floor(b.y + b.h / 2), 1, 1).data[3] < 250;
}
function drawPhoto(b) {
  ctx.save(); ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, CONFIG.radius || 0); else ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
  const s = Math.max(b.w / photo.naturalWidth, b.h / photo.naturalHeight) * zoom;
  const w = photo.naturalWidth * s, h = photo.naturalHeight * s;
  ctx.drawImage(photo, b.x + (b.w - w) / 2 + ox * b.w, b.y + (b.h - h) / 2 + oy * b.h, w, h);
  ctx.restore();
}
function draw() {
  if (!frame) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!box) { ctx.drawImage(frame, 0, 0); return; }
  const b = px();
  if (transparent) {
    ctx.fillStyle = '#e6e6e6'; ctx.fillRect(b.x, b.y, b.w, b.h);
    if (photo) drawPhoto(b);
    ctx.drawImage(frame, 0, 0);
  } else {
    ctx.drawImage(frame, 0, 0);
    if (photo) drawPhoto(b);
    else {
      ctx.save(); ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, CONFIG.radius || 0); else ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
      ctx.fillStyle = '#e4e4e4'; ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#1b2a41'; ctx.font = '600 ' + Math.round(b.w / 12) + 'px "Hind Siliguri",sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('ছবি আপলোড করুন', b.x + b.w / 2, b.y + b.h / 2); ctx.restore();
    }
  }
  if (setup) { ctx.strokeStyle = '#e11'; ctx.lineWidth = Math.max(3, cv.width / 250); ctx.strokeRect(b.x, b.y, b.w, b.h); }
}
function setSetup(on) { setup = on; $('setup').style.display = on ? 'block' : 'none'; draw(); }
$('stog').onclick = () => setSetup(!setup);

$('up').onclick = () => { if (!box) { alert('আগে সেটআপ করুন'); return; } $('pf').click(); };
$('pf').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image(); im.onload = () => { photo = im; zoom = 1; ox = oy = 0; $('z').value = 1; $('dl').disabled = false; draw(); };
  im.src = URL.createObjectURL(f);
};
$('z').oninput = e => { zoom = +e.target.value; draw(); };
$('rs').onclick = () => { zoom = 1; ox = oy = 0; $('z').value = 1; draw(); };
$('dl').onclick = () => {
  const a = document.createElement('a'); a.download = CONFIG.fileName; a.href = cv.toDataURL('image/png'); a.click();
};

// drag
let drag = null, start = null;
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }
cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); const p = pt(e); if (setup) start = p; else if (photo) drag = { p, ox, oy }; };
cv.onpointermove = e => {
  const p = pt(e);
  if (setup && start) {
    box = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
    draw();
  } else if (drag && box) { ox = drag.ox + (p.x - drag.p.x) / box.w; oy = drag.oy + (p.y - drag.p.y) / box.h; draw(); }
};
cv.onpointerup = () => {
  if (setup && start && box) {
    start = null; detect();
    const r = n => +n.toFixed(4), j = JSON.stringify({ x: r(box.x), y: r(box.y), w: r(box.w), h: r(box.h) });
    $('out').value = 'box: ' + j + ',';
    try { localStorage.setItem('box', j); } catch (e) {}
    draw();
  }
  drag = null;
};
$('ff').onchange = e => { const f = e.target.files[0]; if (f) loadFrame(URL.createObjectURL(f)); };

loadFrame(CONFIG.frame);
</script>
</body>
</html>
